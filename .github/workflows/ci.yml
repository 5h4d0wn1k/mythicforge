name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Lint (syntax check)
        run: |
          python -m compileall mythicforge tests -q
      - name: Run tests with coverage
        run: |
          pytest -q --cov=mythicforge --cov-report=term-missing
      - name: Demo smoke test
        run: |
          mythicforge --demo --output-dir reports --report-formats json html sarif --quiet
      - name: Verify reports generated
        run: |
          test -f reports/mythicforge_report.json
          test -f reports/mythicforge_report.html
          test -f reports/mythicforge_report.sarif
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: reports/

  packaging:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel/sdist
        run: |
          pip install build
          python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/